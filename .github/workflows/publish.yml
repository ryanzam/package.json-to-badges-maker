name: Publish to npm 

on:  
release:  
types: \[published\] 

jobs:  
publish:  
runs-on: ubuntu-latest  
steps:  
\- name: Checkout repository  
uses: actions/checkout@v4 

\- name: Setup Node.js  
uses: actions/setup-node@v4  
with:  
node-version: 'lts/\*'  
registry-url: 'npmjs.org' 

\- name: Install dependencies  
run: npm ci 

\- name: Run tests  
run: npm test --if-present 

\- name: Publish to npm  
run: npm publish  
env:  
NODE\_AUTH\_TOKEN: ${{ secrets.NPM\_TOKEN }}